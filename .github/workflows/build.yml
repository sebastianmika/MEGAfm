name: build

on: [pull_request]

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          tags: megafm
      - name: Check Check Format
        run: |
          docker run -v $(pwd):/app --rm megafm make check_fmt
      - name: Check Build Firmware
        run: |
          docker run -v $(pwd):/app --rm megafm make firmware.syx
      - name: Extract version from constants.h
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('include/constants.h', 'utf8');
            const version0 = content.match(/const byte kVersion0[^0-9]*([0-9]+)/)[1];
            const version1 = content.match(/const byte kVersion1[^0-9]*([0-9]+)/)[1];
            core.setOutput('firmware_name', `MEGAfm.${version0}.${version1}.syx`);
      - uses: actions/upload-artifact@v7
        with:
          path: firmware.syx
          name: ${{ steps.version.outputs.firmware_name }}
          archive: false
